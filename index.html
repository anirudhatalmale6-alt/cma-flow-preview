<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check My Accountant — new flow preview</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
body{margin:0;background:#f2f6f4;padding:24px 0;}
/* Check My Accountant — quiz styling */
#cma-app{--ink:#14342F;--teal:#2C7A6B;--mint:#EAF4F0;--line:#e3e8e6;--muted:#5b6b66;
  max-width:720px;margin:0 auto;padding:20px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;}
#cma-app *{box-sizing:border-box;}
.cma-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:38px 34px;
  box-shadow:0 8px 34px rgba(20,52,47,.07);}
.cma-center{text-align:center;}

/* intro */
.cma-badges{display:flex;gap:10px;justify-content:center;margin-bottom:22px;flex-wrap:wrap;}
.cma-badges span{background:var(--mint);color:var(--teal);font-size:12px;font-weight:700;
  letter-spacing:.4px;text-transform:uppercase;padding:6px 14px;border-radius:20px;}
.cma-intro{text-align:center;}
.cma-h1{font-size:32px;line-height:1.2;margin:0 0 16px;font-weight:800;letter-spacing:-.5px;}
.cma-h1 em{color:var(--teal);font-style:italic;}
.cma-sub{font-size:17px;line-height:1.6;color:var(--muted);margin:0 0 26px;}
.cma-center.cma-sub{margin-left:auto;margin-right:auto;max-width:520px;}
.cma-fine{font-size:13px;color:#98a5a1;margin:14px 0 0;}

/* buttons */
.cma-btn{display:inline-block;text-align:center;text-decoration:none;line-height:1.2;
  background:var(--ink);color:#fff;border:none;border-radius:10px;padding:14px 30px;
  font-size:16px;font-weight:700;cursor:pointer;transition:transform .08s ease,background .2s;}
.cma-btn:hover,.cma-btn:focus{text-decoration:none;color:#fff;}
.cma-btn:hover{background:#0f2723;}
.cma-btn:active{transform:translateY(1px);}
.cma-btn:disabled{background:#c3ceca;cursor:not-allowed;}
.cma-btn-lg{padding:17px 40px;font-size:18px;width:100%;max-width:340px;}

/* progress */
.cma-progress{height:8px;background:var(--mint);border-radius:8px;overflow:hidden;margin-bottom:22px;}
.cma-progress-bar{height:100%;background:var(--teal);border-radius:8px;transition:width .3s ease;}
.cma-qcount{font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--teal);margin:0 0 8px;}
.cma-q{font-size:23px;line-height:1.35;margin:0 0 24px;font-weight:700;}

/* options */
.cma-opts{display:flex;flex-direction:column;gap:12px;}
.cma-opt{display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;
  background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px 18px;
  font-size:16px;line-height:1.45;color:var(--ink);cursor:pointer;transition:all .15s ease;}
.cma-opt:hover{border-color:var(--teal);background:var(--mint);}
.cma-opt.sel{border-color:var(--teal);background:var(--mint);}
.cma-opt-dot{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:2px solid #c3ceca;margin-top:2px;transition:all .15s;}
.cma-opt.sel .cma-opt-dot{border-color:var(--teal);background:var(--teal);box-shadow:inset 0 0 0 3px #fff;}
.cma-nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;}
.cma-back{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:8px 4px;}
.cma-back:hover{color:var(--ink);}

/* teaser + gate */
.cma-teaser{text-align:center;background:var(--mint);border-radius:14px;padding:24px;margin-bottom:26px;}
.cma-teaser-lbl{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--teal);font-weight:700;margin:0 0 4px;}
.cma-teaser-pct{font-size:46px;font-weight:800;line-height:1;color:var(--ink);}
.cma-teaser-bar{height:10px;background:#d3e5df;border-radius:8px;max-width:360px;margin:14px auto 8px;overflow:hidden;}
.cma-teaser-bar div{height:100%;background:linear-gradient(90deg,#e07a5f,#f2cc8f,var(--teal));border-radius:8px;transition:width 1s ease;}
.cma-teaser-note{font-size:14px;color:var(--muted);margin:0;font-weight:600;}
.cma-gate-h{font-size:22px;margin:0 0 8px;text-align:center;font-weight:700;}
.cma-fields{display:flex;flex-direction:column;gap:12px;margin:8px 0 22px;}
.cma-row{display:flex;gap:12px;}
.cma-row input{flex:1;min-width:0;}
.cma-fields input{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;color:var(--ink);}
.cma-fields input:focus{outline:none;border-color:var(--teal);}
.cma-select{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;
  color:var(--ink);background:#fff;-webkit-appearance:none;appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%232C7A6B' stroke-width='3'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 16px center;padding-right:42px;}
.cma-select:focus{outline:none;border-color:var(--teal);}
.cma-select:invalid,.cma-select option[value=""]{color:#98a5a1;}
.cma-check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.45;cursor:pointer;
  background:var(--mint);padding:14px 16px;border-radius:10px;}
.cma-check input{margin-top:3px;flex:0 0 auto;width:18px;height:18px;accent-color:var(--teal);}
.cma-err{color:#c0392b;font-size:14px;text-align:center;margin:14px 0 0;min-height:18px;}

/* loading */
.cma-loading{padding:60px 30px;}
.cma-spin{width:52px;height:52px;border:4px solid var(--mint);border-top-color:var(--teal);border-radius:50%;
  animation:cma-spin 1s linear infinite;margin:0 auto 22px;}
.cma-mini-spin{width:18px;height:18px;border:2px solid var(--mint);border-top-color:var(--teal);border-radius:50%;
  animation:cma-spin 1s linear infinite;}
.cma-load-h{font-size:22px;margin:0 0 8px;}
@keyframes cma-spin{to{transform:rotate(360deg);}}
#cma-btime,#cma-ttime{font-variant-numeric:tabular-nums;color:var(--teal);font-weight:700;}
.cma-elip{display:inline-block;width:1.1em;text-align:left;animation:cma-elip 1.4s steps(4,end) infinite;overflow:hidden;vertical-align:bottom;}
@keyframes cma-elip{0%{clip-path:inset(0 100% 0 0);}100%{clip-path:inset(0 0 0 0);}}

/* report */
.cma-score{background:var(--ink);color:#fff;border-radius:14px;padding:30px 28px 24px;text-align:center;margin-bottom:22px;}
.cma-score-lbl{margin:0 0 4px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#9ec9bd;}
.cma-score-pct{font-size:56px;font-weight:800;line-height:1;color:#fff;}
.cma-score-detail{margin:8px 0 16px;font-size:15px;color:#d7e7e1;}
.cma-score-bar{background:rgba(255,255,255,.15);border-radius:20px;height:14px;max-width:400px;margin:0 auto;overflow:hidden;}
.cma-score-bar div{height:100%;border-radius:20px;background:linear-gradient(90deg,#e07a5f,#f2cc8f,#7ed0b8);transition:width 1.4s ease;}
.cma-score-scale{display:flex;justify-content:space-between;max-width:400px;margin:7px auto 0;font-size:11px;color:rgba(255,255,255,.5);}
.cma-prelude{font-size:17px;color:var(--muted);font-style:italic;margin:8px 0 22px;text-align:center;}
.cma-report-text{font-size:16.5px;line-height:1.8;color:#2c3a37;}
.cma-report-text p{margin:0 0 18px;}
.cma-report-h{color:var(--ink);font-size:18px;margin:26px 0 8px;font-weight:800;}
.cma-word{opacity:0;transition:opacity .35s ease;}
.cma-word.show{opacity:1;}

/* audio player */
.cma-player{display:inline-flex;align-items:center;gap:12px;background:var(--mint);
  padding:10px 18px;border-radius:30px;margin-bottom:20px;}
.cma-player span{font-size:13px;color:var(--ink);font-weight:600;}
.cma-player-txt{display:flex;flex-direction:column;text-align:left;}
.cma-player-txt strong{font-size:13px;color:var(--ink);}
.cma-player-txt span{font-size:11px;color:#889;font-weight:400;}
.cma-pbtn{width:40px;height:40px;border-radius:50%;border:none;background:var(--ink);color:#fff;
  font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cma-prog{width:100px;height:5px;background:#cfe1db;border-radius:3px;cursor:pointer;}
.cma-prog #cma-progb{width:0;height:100%;background:var(--ink);border-radius:3px;}

/* colin (brand guide) */
.cma-colin-intro{display:flex;align-items:center;gap:16px;text-align:left;
  background:var(--mint);border-radius:14px;padding:16px 18px;margin:0 0 22px;}
.cma-colin-head{width:64px;height:64px;border-radius:50%;flex:0 0 auto;
  box-shadow:0 3px 10px rgba(20,52,47,.15);background:#fff;}
.cma-colin-bubble{font-size:14.5px;line-height:1.5;color:var(--ink);}
.cma-colin-bubble strong{color:var(--teal);}
.cma-colin-byline{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0 22px;}
.cma-colin-byline img{width:44px;height:44px;border-radius:50%;flex:0 0 auto;background:#fff;
  box-shadow:0 2px 8px rgba(20,52,47,.12);}
.cma-colin-byline p{font-size:16px;color:var(--muted);font-style:italic;margin:0;text-align:left;}
.cma-colin-cta{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;display:block;background:#fff;
  box-shadow:0 4px 14px rgba(20,52,47,.16);}
@media(max-width:560px){ .cma-colin-intro{flex-direction:column;text-align:center;}
  .cma-colin-bubble{text-align:center;} }

/* voice orb */
.cma-orb-wrap{text-align:center;margin:6px 0 18px;}
.cma-orb-stage{position:relative;width:160px;height:160px;margin:0 auto;cursor:pointer;
  transition:transform .12s ease;}
.cma-orb-stage:hover{transform:scale(1.03);}
.cma-orb-stage:active{transform:scale(.98);}
#cma-orb{width:160px;height:160px;display:block;}
.cma-orb-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.4);}
.cma-orb-label{margin-top:8px;font-size:13.5px;color:var(--muted);font-weight:600;cursor:pointer;}

/* cta */
.cma-cta{background:var(--mint);border:1px solid #d5e6e0;border-radius:14px;padding:34px 26px;text-align:center;margin-top:36px;}
.cma-cta h3{color:var(--ink);font-size:21px;margin:0 0 8px;font-weight:800;line-height:1.35;}
.cma-cta p{color:var(--muted);font-size:16px;margin:0 0 22px;}

@media(max-width:560px){
  .cma-card{padding:26px 20px;border-radius:14px;}
  .cma-h1{font-size:26px;}
  .cma-q{font-size:20px;}
  .cma-row{flex-direction:column;gap:12px;}
  .cma-score-pct{font-size:46px;}
}

/* NEW-flow additions (prototype) */
/* cost-of-staying levers */
.cma-levers{display:flex;flex-direction:column;gap:12px;margin:0 0 20px;}
.cma-lever{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:16px 18px;}
.cma-lever-body{flex:1;min-width:0;}
.cma-lever-body h4{margin:0 0 4px;font-size:16px;font-weight:800;color:var(--ink);}
.cma-lever-body p{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted);}
.cma-lever-amt{flex:0 0 auto;font-size:22px;font-weight:800;color:var(--teal);white-space:nowrap;
  font-variant-numeric:tabular-nums;}

/* section labels + annual subtotal on the cost screen */
.cma-block-lbl{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);font-weight:800;margin:0 0 10px;}
.cma-annual{font-size:15.5px;color:var(--muted);text-align:center;margin:14px 0 24px;}
.cma-annual b{color:var(--ink);}

/* exit value = the gold dust: before/after sale comparison */
.cma-exit{background:linear-gradient(160deg,#14342F,#1e4a42);border-radius:16px;padding:24px 22px;color:#fff;}
.cma-exit .cma-block-lbl{color:#9ec9bd;text-align:center;margin-bottom:16px;}
.cma-exit-cmp{display:flex;align-items:stretch;gap:12px;justify-content:center;}
.cma-exit-card{flex:1;min-width:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:16px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;}
.cma-exit-card.win{background:rgba(126,208,184,.14);border-color:rgba(126,208,184,.42);}
.cma-exit-tag{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#9ec9bd;font-weight:800;}
.cma-exit-card.win .cma-exit-tag{color:#8fe0c9;}
.cma-exit-desc{font-size:12.5px;color:#c8ddd6;line-height:1.4;min-height:52px;}
.cma-exit-val{font-size:24px;font-weight:800;color:#fff;margin-top:2px;font-variant-numeric:tabular-nums;}
.cma-exit-arrow{display:flex;align-items:center;color:#7ed0b8;font-size:22px;font-weight:800;}
.cma-exit-gap{text-align:center;font-size:34px;font-weight:800;color:#8fe0c9;margin-top:18px;font-variant-numeric:tabular-nums;}
.cma-exit-gap span{display:block;font-size:14px;font-weight:600;color:#d7e7e1;margin-top:2px;}
@media(max-width:560px){ .cma-exit-cmp{flex-direction:column;} .cma-exit-arrow{transform:rotate(90deg);justify-content:center;height:22px;}
  .cma-exit-desc{min-height:0;} .cma-exit-val{font-size:22px;} .cma-exit-gap{font-size:28px;} }

/* combined cost summary (dark, like the score card) */
.cma-costsum{background:var(--ink);color:#fff;border-radius:14px;padding:26px 24px;text-align:center;}
.cma-costsum-top{margin:0 0 6px;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:#9ec9bd;}
.cma-costsum-big{font-size:42px;font-weight:800;line-height:1;color:#fff;}
.cma-costsum-big span{font-size:18px;font-weight:600;color:#d7e7e1;}
.cma-costsum-sub{margin:10px 0 0;font-size:14.5px;color:#d7e7e1;}

/* three-way choice */
.cma-choices{display:flex;flex-direction:column;gap:12px;}
.cma-choice{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;background:#fff;
  border:2px solid var(--line);border-radius:12px;padding:18px 20px;cursor:pointer;transition:all .15s ease;}
.cma-choice:hover{border-color:var(--teal);background:var(--mint);}
.cma-choice-t{font-size:17px;font-weight:800;color:var(--ink);}
.cma-choice-t em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  color:var(--teal);background:var(--mint);padding:3px 8px;border-radius:20px;margin-left:8px;vertical-align:middle;}
.cma-choice-s{font-size:14px;line-height:1.5;color:var(--muted);}
.cma-choice.primary{border-color:var(--teal);box-shadow:0 6px 20px rgba(44,122,107,.14);}
.cma-choice.primary:hover{background:var(--mint);}

/* sellability radio-pill questions on the valuation inputs screen */
.cma-qgroup{margin:0 0 18px;}
.cma-qlabel{font-size:15px;font-weight:700;color:var(--ink);line-height:1.45;margin:0 0 10px;}
.cma-pills{display:flex;flex-wrap:wrap;gap:8px;}
.cma-pill{flex:1;min-width:120px;background:#fff;border:2px solid var(--line);border-radius:10px;
  padding:12px 14px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .15s ease;text-align:center;}
.cma-pill:hover{border-color:var(--teal);background:var(--mint);}
.cma-pill.sel{border-color:var(--teal);background:var(--mint);color:var(--teal);}
@media(max-width:560px){ .cma-pill{min-width:0;flex-basis:calc(50% - 4px);} }

/* bridge from the report into the "what this means" money step */
.cma-bridge{margin-top:30px;padding-top:26px;border-top:1px solid var(--line);text-align:center;}
.cma-bridge p{font-size:17px;line-height:1.55;color:var(--ink);font-weight:600;margin:0 0 18px;max-width:520px;margin-left:auto;margin-right:auto;}

/* recap chip on the help form */
.cma-recap{font-size:13.5px;color:var(--muted);background:var(--mint);border-radius:10px;padding:12px 14px;}
.cma-recap button{background:none;border:none;color:var(--teal);font-weight:700;cursor:pointer;
  font-size:13.5px;padding:0 0 0 6px;text-decoration:underline;}

@media(max-width:560px){
  .cma-lever{flex-direction:column;align-items:flex-start;gap:8px;}
  .cma-lever-amt{font-size:20px;}
  .cma-costsum-big{font-size:34px;}
}

</style></head>

    "Three things stand out. First, nobody is actively hunting your tax reliefs and allowances, so you're almost certainly leaving money with HMRC that could stay in the business. Second, you don't have anyone reading your numbers with you — no one turning your accounts into decisions about pricing, margin or cash. Third, and this is the big one, nobody is building your business to be sellable; you're running it, not growing an asset.\n"+

  function headByline(txt){

    return '<div class="cma-colin-byline"><img src="'+HEAD+'" alt="Colin"/><p>'+txt+'</p></div>';
  }
  function esc(s){ return (s+'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function tierLabel(pct){ return pct<=40?'You\'ve got a bookkeeper, not an accountant':(pct<=65?'Compliance covered, but little beyond the basics':(pct<=85?'A fair service, with real gaps to close':'You\'re in good hands')); }

  /* ---------- 1. SCORE REVEAL (free teaser) ---------- */
  function showScore(){
    var pct=demo.score;
    app.html(
      '<div class="cma-card cma-report">'+
        scoreCard(pct,false)+
        headByline('That\'s your headline number. Now let me actually talk you through it — where you stand, what you\'re missing, and where it could go. Takes about 90 seconds.')+
        '<div class="cma-center">'+
          '<button class="cma-btn cma-btn-lg" id="cma-toreport">Hear Colin\'s full verdict</button>'+
          '<p class="cma-fine">Spoken and in writing. Then I\'ll show you what it means in pounds.</p>'+
        '</div>'+
      '</div>'
    );
    setTimeout(function(){ $('#cma-bar').css('width',pct+'%'); },300);
    $('#cma-toreport').on('click', showGate);
  }
  function scoreCard(pct,small){
    return '<div class="cma-score"'+(small?' style="padding:20px 24px 16px;margin-bottom:16px"':'')+'>'+
      '<p class="cma-score-lbl">Your Accountancy Health Score</p>'+
      '<div class="cma-score-pct"'+(small?' style="font-size:40px"':'')+'>'+pct+'%</div>'+
      '<p class="cma-score-detail">'+tierLabel(pct)+'</p>'+
      '<div class="cma-score-bar"><div id="cma-bar" style="width:0%"></div></div>'+
      '<div class="cma-score-scale"><span>Needs attention</span><span>Fair</span><span>In good hands</span></div>'+
    '</div>';
  }

  /* ---------- 2. LIGHT GATE (report is the reason to give the email; captures the lead) ---------- */
  function showGate(){
    app.html(
      '<div class="cma-card">'+
        headByline('Your full verdict is ready — spoken and written. Where should I send you a copy to keep?')+
        '<h2 class="cma-gate-h">Where should Colin send your report?</h2>'+
        '<p class="cma-sub cma-center">Just your name and email. No spam, ever — and you can hear it right here on the next screen.</p>'+
        '<div class="cma-fields">'+
          '<input id="g-name" placeholder="Your name*"/>'+
          '<input id="g-email" type="email" placeholder="Email address*"/>'+
        '</div>'+
        '<button class="cma-btn cma-btn-lg" id="cma-unlock">Hear my verdict</button>'+
        '<p class="cma-err" id="cma-gate-err"></p>'+
      '</div>'
    );
    $('#cma-unlock').on('click', function(){
      var nm=$('#g-name').val().trim(), em=$('#g-email').val().trim();
      if(!nm||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ $('#cma-gate-err').text('Just your name and a valid email.'); return; }
      demo.name=nm; demo.email=em; showReport();
    });
  }

  /* ---------- 3. THE REPORT — Colin speaking (voice orb) + written (the piece de resistance) ---------- */
  function showReport(){
    var first=(demo.name||'').split(/\s+/)[0];
    app.html(
      '<div class="cma-card cma-report">'+
        scoreCard(demo.score,true)+
        '<div id="cma-orb-host" class="cma-center"></div>'+
        headByline((first?esc(first)+', I\'ve':'I\'ve')+' been through your answers — here\'s my honest read on how your accountant is serving you.')+
        '<div id="cma-report-text" class="cma-report-text"></div>'+
        '<div class="cma-bridge">'+
          '<p>That\'s the picture. Want to see what it actually means for your business — in pounds and pence?</p>'+
          '<button class="cma-btn cma-btn-lg" id="cma-tomoney">Show me what this means</button>'+
        '</div>'+
      '</div>'
    );
    buildOrb(AUDIO);
    renderReportBody(SAMPLE_REPORT);
    $('#cma-tomoney').on('click', showInputs);
  }
  function renderReportBody(report){
    var el=$('#cma-report-text'); el.empty();
    var spans=[], curP=null;
    var headRe=/^(where you stand|what you'?re missing|where this could go)\s*$/i;
    report.split(/\n/).forEach(function(raw){
      var line=(raw||'').replace(/’/g,"'").trim(); if(!line){ curP=null; return; }
      if(headRe.test(line)){ el.append('<h3 class="cma-report-h">'+esc(line)+'</h3>'); curP=null; return; }
      if(!curP){ curP=$('<p></p>'); el.append(curP); }
      line.split(/\s+/).forEach(function(w){ if(!w) return; var s=$('<span class="cma-word">'+esc(w)+' </span>'); curP.append(s); spans.push(s); });
    });
    var i=0;(function r(){ if(i>=spans.length) return; spans[i].addClass('show'); i++; setTimeout(r,22); })();
  }

  /* ---- reactive voice orb (ported from live cma-quiz.js; native playback on touch = guaranteed sound) ---- */
  function buildOrb(url){
    var audio=new Audio(); audio.preload='none';
    audio.setAttribute('playsinline',''); audio.setAttribute('webkit-playsinline',''); audio.playsInline=true; audio.src=url;
    var isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0)||/iP(hone|ad|od)|Android|Mobile/i.test(navigator.userAgent||'');
    var playing=false,dur=0,actx=null,analyser=null,srcNode=null,data=null,phase=0;
    $('#cma-orb-host').html(
      '<div class="cma-orb-wrap"><div class="cma-orb-stage" id="cma-orb-stage">'+
        '<canvas id="cma-orb" width="320" height="320"></canvas>'+
        '<div class="cma-orb-center"><span id="cma-orb-ico">&#9654;</span></div>'+
      '</div><div class="cma-orb-label" id="cma-orb-label">Tap to hear Colin\'s verdict</div></div>');
    var canvas=document.getElementById('cma-orb'),ctx=canvas.getContext('2d'),CX=160,CY=160;
    function graph(){ if(isTouch||actx) return; var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      try{ actx=new AC(); srcNode=actx.createMediaElementSource(audio); analyser=actx.createAnalyser();
        analyser.fftSize=128; analyser.smoothingTimeConstant=0.82; data=new Uint8Array(analyser.frequencyBinCount);
        srcNode.connect(analyser); analyser.connect(actx.destination);
      }catch(e){ actx=null; } }
    function draw(){ requestAnimationFrame(draw); ctx.clearRect(0,0,320,320);
      var bins=null,amp=0; if(analyser){ analyser.getByteFrequencyData(data); bins=data; for(var i=0;i<bins.length;i++) amp+=bins[i]; amp=amp/bins.length/255; }
      phase+=0.028; var idle=(Math.sin(phase)*0.5+0.5)*0.16; var pulse=playing?(0.12+amp*0.9):idle; var baseR=52+pulse*12;
      var g=ctx.createRadialGradient(CX,CY,baseR*0.3,CX,CY,baseR+58+pulse*30);
      g.addColorStop(0,'rgba(44,122,107,'+(0.42+pulse*0.42)+')'); g.addColorStop(0.55,'rgba(44,122,107,0.10)'); g.addColorStop(1,'rgba(44,122,107,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(CX,CY,baseR+60,0,Math.PI*2); ctx.fill();
      var N=72; for(var b=0;b<N;b++){ var idx=Math.floor(b/N*(bins?bins.length:1));
        var v=bins? bins[idx]/255 : (Math.sin(phase*2+b*0.28)*0.5+0.5)*0.22; var ang=(b/N)*Math.PI*2 - Math.PI/2;
        var r1=baseR+7,r2=r1+v*42*(playing?1:0.45); ctx.strokeStyle='rgba(126,208,184,'+(0.30+v*0.7)+')'; ctx.lineWidth=2.3; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(CX+Math.cos(ang)*r1,CY+Math.sin(ang)*r1); ctx.lineTo(CX+Math.cos(ang)*r2,CY+Math.sin(ang)*r2); ctx.stroke(); }
      var cg=ctx.createRadialGradient(CX-baseR*0.35,CY-baseR*0.35,baseR*0.15,CX,CY,baseR);
      cg.addColorStop(0,'#8fe0c9'); cg.addColorStop(0.45,'#2C7A6B'); cg.addColorStop(1,'#14342F');
      ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(CX,CY,baseR,0,Math.PI*2); ctx.fill();
      var pr=baseR+22+pulse*16; for(var p=0;p<44;p++){ var pa=(p/44)*Math.PI*2 + phase*0.35;
        ctx.fillStyle='rgba(201,162,75,'+(0.22+pulse*0.5)+')'; ctx.beginPath(); ctx.arc(CX+Math.cos(pa)*pr,CY+Math.sin(pa)*pr,1.5,0,Math.PI*2); ctx.fill(); }
      if(dur>0){ ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=3; ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(CX,CY,baseR+70,-Math.PI/2,-Math.PI/2+(audio.currentTime/dur)*Math.PI*2); ctx.stroke(); } }
    function toggle(){ graph(); if(actx&&actx.state==='suspended') actx.resume(); if(playing) audio.pause(); else audio.play().catch(function(){}); }
    audio.addEventListener('loadedmetadata',function(){ dur=audio.duration; });
    audio.addEventListener('play',function(){ playing=true; $('#cma-orb-ico').html('&#10074;&#10074;'); $('#cma-orb-label').text('Colin is speaking…'); });
    audio.addEventListener('pause',function(){ playing=false; $('#cma-orb-ico').html('&#9654;'); if(!audio.ended) $('#cma-orb-label').text('Paused — tap to resume'); });
    audio.addEventListener('ended',function(){ playing=false; $('#cma-orb-ico').html('&#9654;'); $('#cma-orb-label').text('Replay'); });
    $('#cma-orb-host').on('click','#cma-orb-stage, #cma-orb-label', toggle);
    draw();
  }

  /* ---------- 4. VALUATION INPUTS (5 quick Qs; unlock the number + qualify sellability) ---------- */
  function pillGroup(g,label,opts){
    return '<div class="cma-qgroup"><p class="cma-qlabel">'+label+'</p><div class="cma-pills">'+
      opts.map(function(o){return '<button class="cma-pill" data-g="'+g+'" data-v="'+o[0]+'">'+esc(o[1])+'</button>';}).join('')+'</div></div>';
  }
  function showInputs(){
    app.html(
      '<div class="cma-card">'+
        headByline('Five quick taps and I\'ll show you what your business could really be worth — as it is now, versus well-run.')+
        '<h2 class="cma-gate-h">Your business, in 20 seconds</h2>'+
        '<div class="cma-fields">'+
          '<select id="i-ind" class="cma-select"><option value="">What industry are you in?*</option>'+SECTORS.map(function(s,i){return '<option value="'+i+'">'+esc(s.key)+'</option>';}).join('')+'</select>'+
          '<select id="i-turn" class="cma-select"><option value="">Approximate annual turnover?*</option>'+TURNOVER.map(function(t,i){return '<option value="'+i+'">'+esc(t.label)+'</option>';}).join('')+'</select>'+
        '</div>'+
        pillGroup('rec','Roughly what % of your revenue is recurring or repeat?',[['under','Under 30%'],['mid','30–60%'],['over','Over 60%']])+
        pillGroup('own','If you took 3 months off, would the business still run and make money?',[['no','No, it would struggle'],['mostly','Yes, mostly'],['fully','Yes, completely']])+
        pillGroup('con','Do your top 3 clients make up more than 40% of your revenue?',[['yes','Yes'],['no','No'],['ns','Not sure']])+
        '<div class="cma-center" style="margin-top:8px"><button class="cma-btn cma-btn-lg" id="cma-calc">Show me the numbers</button></div>'+
        '<p class="cma-err" id="cma-in-err"></p>'+
      '</div>'
    );
    $('.cma-pill').on('click', function(){ var g=$(this).data('g'); $('.cma-pill[data-g="'+g+'"]').removeClass('sel'); $(this).addClass('sel'); });
    $('#cma-calc').on('click', function(){
      var ii=$('#i-ind').val(), ti=$('#i-turn').val();
      var rec=$('.cma-pill.sel[data-g="rec"]').data('v'), own=$('.cma-pill.sel[data-g="own"]').data('v'), con=$('.cma-pill.sel[data-g="con"]').data('v');
      if(ii===''||ti===''||!rec||!own||!con){ $('#cma-in-err').text('Just these five, so I can make the numbers real for you.'); return; }
      demo.ind=SECTORS[+ii]; demo.turnoverMid=TURNOVER[+ti].mid; demo.turnoverLabel=TURNOVER[+ti].label;
      demo.recurring=rec; demo.owner=own; demo.concentration=con; showCost();
    });
  }

  /* ---------- 5. COST OF STAYING (personalised £; exit value from the valuation model) ---------- */
  function showCost(){
    var v=computeValuation(demo);
    var shortSec=demo.ind.short?esc(demo.ind.short)+' ':'';
    app.html(
      '<div class="cma-card">'+
        headByline('Here\'s what a genuinely proactive accountant tends to be worth to a '+esc(demo.turnoverLabel)+' '+shortSec+'business — and how much of it a '+demo.score+'% is leaving on the table.')+
        '<h2 class="cma-gate-h" style="margin-bottom:16px">What staying put is quietly costing you</h2>'+
        '<p class="cma-block-lbl">Every year you stay put</p>'+
        '<div class="cma-levers">'+
          lever('Cost &amp; tax savings','A proactive accountant typically finds around 2% of turnover in tax reliefs and cost efficiencies.',money(v.savings)+'/yr')+
          lever('Growth left on the table','Real advice surfaces sales and margin opportunities worth around '+pctTxt(demo.ind.growth)+'% of turnover.',money(v.growth)+'/yr')+
        '</div>'+
        '<p class="cma-annual">Roughly <b>'+money(v.annual)+' a year</b> in profit left on the table.</p>'+
        '<div class="cma-exit">'+
          '<p class="cma-block-lbl">The big one — what your business is worth when you sell</p>'+
          '<div class="cma-exit-cmp">'+
            '<div class="cma-exit-card"><span class="cma-exit-tag">Sell as you are</span><span class="cma-exit-desc">A typical '+shortSec+'business like yours sells for around '+mult(v.current)+' turnover</span><span class="cma-exit-val">'+money(v.curVal)+'</span></div>'+
            '<div class="cma-exit-arrow">&rarr;</div>'+
            '<div class="cma-exit-card win"><span class="cma-exit-tag">Well-run &amp; growing</span><span class="cma-exit-desc">Around '+mult(v.improved)+' turnover, with stronger systems and profitability on the way there</span><span class="cma-exit-val">'+money(v.impVal)+'</span></div>'+
          '</div>'+
          '<div class="cma-exit-gap">+'+money(v.gap)+'<span>more in your pocket the day you sell</span></div>'+
        '</div>'+
        '<p class="cma-fine cma-center" style="max-width:540px;margin:16px auto 0">Illustrative figures for a business your size in your sector — not a promise, and few reach the top multiple. But the gap is real: it is the difference between running a business and building a sellable asset, and it compounds every year you wait.</p>'+
        '<div class="cma-center" style="margin-top:22px"><button class="cma-btn cma-btn-lg" id="cma-tochoice">So where does that leave me?</button></div>'+
      '</div>'
    );
    $('#cma-tochoice').on('click', showChoice);
  }
  function lever(title,desc,amt){ return '<div class="cma-lever"><div class="cma-lever-body"><h4>'+title+'</h4><p>'+desc+'</p></div><div class="cma-lever-amt">'+amt+'</div></div>'; }

  /* ---------- 6. THREE-WAY CHOICE (email already captured, so branches are frictionless) ---------- */
  function showChoice(){
    app.html(
      '<div class="cma-card">'+
        headByline('No pressure at all — this is your call. Where are you right now?')+
        '<h2 class="cma-gate-h" style="margin-bottom:20px">What would you like to do next?</h2>'+
        '<div class="cma-choices">'+
          choice('stay','Nothing for now','That was genuinely useful, but I\'m happy where I am.')+
          choice('learn','Keep me in the loop','Send me practical, no-jargon tips on understanding my numbers and building a more valuable business.')+
          choice('help','I\'d like some help','Connect me with a proactive accountant who can guide me — no obligation.',true)+
        '</div>'+
      '</div>'
    );
    $('.cma-choice').on('click', function(){ var k=$(this).data('k'); if(k==='stay') branchStay(); else if(k==='learn') branchLearn(); else branchHelp(); });
  }
  function choice(k,title,sub,primary){ return '<button class="cma-choice'+(primary?' primary':'')+'" data-k="'+k+'">'+
    '<span class="cma-choice-t">'+title+(primary?' <em>recommended</em>':'')+'</span><span class="cma-choice-s">'+sub+'</span></button>'; }

  /* ---------- 7a. STAY (report already emailed — no form) ---------- */
  function branchStay(){ doneMsg('No problem at all','Genuinely glad it was useful. Your full report is already in your inbox to keep — no follow-up calls, no pressure. All the best with the business.'); }
  /* ---------- 7b. KEEP IN LOOP (we already have the email — one tap) ---------- */
  function branchLearn(){ doneMsg('You\'re in','Nice one'+(demo.name?', '+esc(demo.name.split(/\s+/)[0]):'')+'. I\'ll keep you posted with genuinely useful, no-jargon guidance on understanding your numbers and building a business worth more — plus the best independent resources and tools for owners like you. And if you ever fancy hands-on help, you\'re one reply away.'); }
  /* ---------- 7c. HELP (the £50 lead — now just phone + business, rest already known) ---------- */
  function branchHelp(){
    app.html(
      '<div class="cma-card">'+
        headByline('Great decision. I\'ve already got your report and the shape of your business — just the best way to reach you and I\'ll line you up with the right proactive accountant.')+
        '<h2 class="cma-gate-h">Let\'s connect you</h2>'+
        '<p class="cma-sub cma-center">No calendars, no hard sell. Someone genuinely proactive, matched to your sector, in touch within 7-10 days.</p>'+
        '<div class="cma-fields">'+
          '<div class="cma-row"><input id="h-phone" type="tel" placeholder="Best phone number*"/><input id="h-business" placeholder="Business name*"/></div>'+
          '<div class="cma-recap">'+esc(demo.name||'You')+' · '+esc(demo.email||'—')+' · '+esc(demo.ind?demo.ind.short||demo.ind.key:'')+' · '+esc(demo.turnoverLabel)+'</div>'+
        '</div>'+
        '<button class="cma-btn cma-btn-lg" id="cma-help-send">Connect me</button>'+
        '<p class="cma-err" id="cma-help-err"></p>'+
      '</div>'
    );
    $('#cma-help-send').on('click', function(){
      var ph=$('#h-phone').val().trim(), bz=$('#h-business').val().trim();
      if(!ph||!bz){ $('#cma-help-err').text('Just a phone number and your business name.'); return; }
      doneMsg('Request received — nice one','I\'ve passed your details to a proactive, growth-focused accountant matched to your sector. They\'ll be in touch within 7-10 days. No obligation, just a genuine conversation.');
    });
  }

  function doneMsg(top,body){
    app.html('<div class="cma-card cma-center">'+
      (HEAD?'<img class="cma-colin-cta" src="'+HEAD+'" alt="Colin"/>':'')+
      '<p class="cma-teaser-lbl">'+esc(top)+'</p>'+
      '<h2 class="cma-h1" style="font-size:26px;margin-top:4px">Thanks for taking the time.</h2>'+
      '<p class="cma-sub cma-center">'+body+'</p></div>');
  }

  /* demo entry (a query param lets the screenshot script jump to any screen) */
  var start=(new URLSearchParams(location.search)).get('s')||'score';
  var map={score:showScore, gate:showGate, report:showReport, inputs:showInputs, cost:showCost, choice:showChoice, stay:branchStay, learn:branchLearn, help:branchHelp};
  if(start!=='score'&&start!=='gate'){ demo.name='Sam Carter'; demo.email='sam@example.co.uk'; }
  if(start!=='score'&&start!=='gate'&&start!=='report'){ demo.ind=SECTORS[4]; demo.turnoverMid=750000; demo.turnoverLabel='£500k – £1m'; demo.recurring='mid'; demo.owner='mostly'; demo.concentration='no'; }
  (map[start]||showScore)();
})(jQuery);
</script>
